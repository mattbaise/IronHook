name: IronHook tests

on:
  push:
    branches: [main, ironhook-v3]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Run complete test suite
        run: python -m pytest -v
      - name: Package verified IronHook v3
        uses: actions/upload-artifact@v4
        with:
          name: IronHook_v3
          path: |
            .env.example
            .gitignore
            README.md
            app.py
            db.py
            ironhook_container_schema_v1.sql
            ironhook_demo_data_v1.sql
            requirements.txt
            routes.py
            static/
            templates/
            tests/
            validation.py
          if-no-files-found: error
